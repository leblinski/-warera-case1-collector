name: Collect WarEra Case I market

on:
  workflow_dispatch:
    inputs:
      max_seconds:
        description: >-
          How long collection may spend on the network. The default suits a 15 minute
          cadence. Raise it for a run that has to walk back further than usual, such as
          the first run after an outage, where the scan must cover every hour since the
          last success rather than the last quarter of an hour.
        default: '600'
      timeout_minutes:
        description: >-
          The job's own ceiling, which has to leave room for the budget above plus the
          commit and the Pages deploy. Raise both together or the run is killed mid-scan.
        default: '14'
  schedule:
    # A fallback only. schedule does fire on this repository, but nowhere near as often as
    # asked: a 15 minute cron delivered 2 runs in 8 hours against about 32 requested, in
    # gaps of roughly 2h40m each, and three earlier expressions produced none at all across
    # the preceding 8 hours. Every push-triggered run started in the second it was created,
    # so the constraint is the schedule dispatcher rather than runner supply, and asking
    # more often does not make it deliver more. The cadence now comes from an external
    # scheduler calling workflow_dispatch instead - see the README. This stays as an hourly
    # safety net in case that scheduler stops or its token expires; at roughly one delivery
    # every few hours it is worth about what it costs.
    - cron: '41 * * * *'
  push:
    branches: [main]
    paths:
      - collector.py
      - config/**
      - tests/**
      - .github/workflows/collect.yml

permissions:
  contents: write
  pages: write
  id-token: write

# The lock is taken per job rather than for the whole workflow. One workflow-wide group
# meant a job that never started still held it, and everything behind it was cancelled
# while it queued.

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes || '14') }}
    # Collection serialises against itself, because it commits to main and carries one
    # rolling cache between runs: two at once would race over both.
    concurrency:
      group: warera-case1-collector-collect
      cancel-in-progress: false
    outputs:
      publishable: ${{ steps.validate.outcome }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collection and cache safety
        run: python -m unittest discover -s tests -v
      # The rolling cache is state between runs, not source. Committing it grew the
      # repository by an 87MB blob every fifteen minutes - a JSON file that changes
      # throughout does not delta-compress - until GitHub refused the push outright. It
      # lives in the Actions cache instead, where a new key per run plus a prefix restore
      # gives "read the newest, write a fresh one" without an overwrite.
      - name: Restore the rolling cache from the last run
        uses: actions/cache/restore@v4
        with:
          path: data/warera_case1_market.json
          key: warera-case1-state-${{ github.run_id }}
          restore-keys: warera-case1-state-
      - name: Collect transactions and input prices
        id: collect
        continue-on-error: true
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
        run: python collector.py --max-seconds "${{ inputs.max_seconds || '600' }}"
      - name: Validate generated cache
        id: validate
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        run: python collector.py --validate
      # Saved before anything that can fail, so a run that collected well still hands its
      # state to the next one. A cache key is write-once, so each run writes its own and
      # the prefix restore above picks up the newest.
      - name: Hand the rolling cache to the next run
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: data/warera_case1_market.json
          key: warera-case1-state-${{ github.run_id }}
      # The write-once archive and the daily book snapshots are committed; the rolling
      # cache is not - see the restore step above - and neither are the served artifacts
      # under public/. Both exclusions are what keeps repository growth flat.
      - name: Commit archive and book history
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/archive data/books
          git diff --cached --quiet && exit 0
          git commit -m 'Update WarEra Case I archive and book history'
          # A single push with no rebase and no retry made every lost race a failed run,
          # and the run it failed had already collected, validated and deployed the feed:
          # the history commit is bookkeeping, and reporting it as "collector failed" sends
          # everyone looking at a collector that worked. Rebase onto whatever landed first
          # and try again; only a push that keeps failing is worth waking someone for.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push $attempt was beaten to main; rebasing onto it and retrying."
            sleep $(( attempt * 5 ))
            # Only rebase on a fetch that actually told us something. A push that failed
            # because the network blinked has nothing to replay onto, and rebasing a stale
            # FETCH_HEAD there spent the remaining attempts on a false diagnosis.
            if git fetch origin main; then
              # Ours is one commit of append-only data on top of theirs. If it will not
              # replay cleanly something is wrong that a retry will not fix.
              git rebase FETCH_HEAD || { git rebase --abort || true; break; }
            fi
          done
          echo 'Could not push the archive and book history. The feed was still published.'
          exit 1
      - name: Package price shards for Pages
        if: ${{ !cancelled() && steps.validate.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Retain cache for inspection
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: warera-case1-market-${{ github.run_id }}
          path: data/warera_case1_market.json
          if-no-files-found: warn
          retention-days: 2
      # Last, and never a reason to fail the run: a notification that breaks the job it is
      # reporting on is worse than no notification. Silent when the secret is absent, so a
      # fork or a clone needs no setup.
      - name: Say how it went on Discord
        if: ${{ always() }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_ONLY_WHEN_WRONG: ${{ vars.DISCORD_ONLY_WHEN_WRONG }}
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: python tools/notify.py
      - name: Require healthy live collection
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          if [ "$COLLECT_OUTCOME" != 'success' ]; then
            echo 'Collection failed or is degraded. Any valid partial cache was preserved.'
            exit 1
          fi
          python collector.py --validate --require-healthy

  # Publishing is a separate job so that a deployment which never starts cannot hold
  # collection behind it. A job that names an environment waits for it before its first
  # step, so while the deploy lived in the collect job a deployment stuck in `waiting`
  # meant no collection at all - on 2026-11-09 one sat there sixteen hours and took
  # sixty-four runs with it, each cancelled while queued behind the last. Split, a stuck
  # deployment costs a stale page and nothing else: the archive keeps filling.
  publish:
    needs: collect
    # !cancelled() rather than success(), because a degraded run should still publish what
    # it did collect. The health gate deliberately fails the collect job, and that must not
    # also withhold the feed.
    if: ${{ !cancelled() && needs.collect.outputs.publishable == 'success' }}
    runs-on: ubuntu-latest
    # Only the newest page is worth anything, so a wedged deployment is cancelled by the
    # run behind it rather than outliving it. This is what keeps one stall from becoming
    # permanent.
    concurrency:
      group: warera-case1-collector-pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish price shards
        id: deploy
        uses: actions/deploy-pages@v4
